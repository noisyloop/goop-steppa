[package]
name = "goop-steppa"
version = "0.1.0"
edition = "2021"
description = "Local DNS privacy monitor: blocks telemetry/ads/trackers/malware and shows everything it sees"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
directories = "6"
hickory-proto = "0.26"
hickory-resolver = { version = "0.26", features = ["tls-ring", "https-ring", "webpki-roots"] }
hickory-server = "0.26"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
